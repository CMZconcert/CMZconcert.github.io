<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  {%- include head.html -%}
  <body>
    <header class="site-header">
      <nav class="nav" aria-label="Main navigation">
        <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <div class="nav-links">
          <a href="{{ '/' | relative_url }}#logic">Campaign Logic</a>
          <a href="{{ '/' | relative_url }}#programs">Programs</a>
          <a href="{{ '/' | relative_url }}#publications">Publications</a>
          <a href="{{ '/' | relative_url }}#team">Team</a>
        </div>
      </nav>
    </header>

    <main>
      {{ content }}
    </main>

    <footer class="site-footer">
      <p>{{ site.title }} &middot; {{ site.description }}</p>
      <p><a href="mailto:{{ site.email }}">{{ site.email }}</a> &middot; <a href="{{ site.personal_website }}">Personal website</a></p>
    </footer>
  </body>
</html>
